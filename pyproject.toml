[build-system]
requires = ["setuptools==80.3.1"]
build-backend = "setuptools.build_meta"

[project]
name = "valor-aace"
version = "0.1.0"
description = "Local consequence-planning and counterfactual-memory research"
requires-python = ">=3.11"
dependencies = ["numpy==2.2.5", "gymnasium==1.2.1"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]
learning = ["torch==2.7.1", "stable-baselines3==2.7.1", "matplotlib==3.10.1"]

[project.scripts]
aace = "aace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"aace.demo" = ["static/*.html", "static/*.css", "static/*.js"]
"aace.learning" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
